<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- ── Primary Meta Tags ──────────────────────────────────────────── -->
		<title>MediGuard — AI Health Screening for Bamenda</title>
		<meta name="title" content="MediGuard — AI Health Screening for Bamenda" />
		<meta name="description" content="MediGuard is an AI-powered symptom checker and early disease detection platform built for the Bamenda community. Check symptoms, identify potential conditions, and find nearby health facilities." />
		<meta name="keywords" content="MediGuard, symptom checker, disease prediction, health screening, Bamenda, Cameroon, malaria, typhoid, AI health, community health, early detection, disease library" />
		<meta name="author" content="MediGuard Bamenda" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#0ea5e9" />
		<link rel="canonical" href="https://mediguard.app/" />

		<!-- ── Favicon & Icons ───────────────────────────────────────────── -->
		<link rel="icon" type="image/png" sizes="32x32" href="/mediguard.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/mediguard.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/mediguard.png" />
		<link rel="shortcut icon" type="image/png" href="/mediguard.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- ── Open Graph (Facebook / LinkedIn / WhatsApp / Telegram) ──── -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://mediguard.app/" />
		<meta property="og:site_name" content="MediGuard" />
		<meta property="og:title" content="MediGuard — AI Health Screening for Bamenda" />
		<meta property="og:description" content="AI-powered symptom checker and early disease detection platform for the Bamenda community. Check symptoms, predict diseases, and access local health resources — free, 24/7." />
		<!-- og:image — replace /mediguard.png with a 1200×630 px banner for best results -->
		<meta property="og:image" content="https://mediguard.app/mediguard.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:alt" content="MediGuard — Community AI Health Screening" />
		<meta property="og:locale" content="en_CM" />

		<!-- ── Twitter / X Card ──────────────────────────────────────────── -->
		<!-- Using "summary" because the og:image is the square logo.         -->
		<!-- Upgrade to "summary_large_image" once you add a 1200×630 banner. -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:url" content="https://mediguard.app/" />
		<meta name="twitter:title" content="MediGuard — AI Health Screening for Bamenda" />
		<meta name="twitter:description" content="AI-powered symptom checker and early disease detection for the Bamenda community. Free, fast, and available 24/7." />
		<meta name="twitter:image" content="https://mediguard.app/mediguard.png" />
		<meta name="twitter:image:alt" content="MediGuard Logo" />

		<!-- ── Structured Data: WebApplication (JSON-LD) ─────────────────── -->
		<script type="application/ld+json">

			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "MediGuard",
			"url": "https://mediguard.app",
			"logo": "https://mediguard.app/mediguard.png",
			"image": "https://mediguard.app/mediguard.png",
			"description": "AI-powered symptom checker and early disease detection platform for the Bamenda community in Cameroon.",

			"offers": {
				"@type": "Offer",
				"price": "0",

			},
			"provider": {
				"@type": "Organization",
				"name": "MediGuard",
				"url": "https://mediguard.app",

					"@type": "ImageObject",
					"url": "https://mediguard.app/mediguard.png"

					"@type": "City",
					"name": "Bamenda",

						"@type": "Country",
						"name": "Cameroon"
					}
				}

				"AI-powered symptom checker",

				"AI chat health assistant",
				"Community health trends dashboard",
				"Nearby health facility finder",
				"Pregnancy-aware health screening"
			]
		}

		<!-- ── Structured Data: MedicalWebPage (JSON-LD) ─────────────────── -->

			"@context": "https://schema.org",

			"description": "Community health screening tool providing AI-driven disease prediction and symptom analysis for Bamenda, Cameroon.",

</html>
