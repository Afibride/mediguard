
- name: Install Cloudflare Client & Run SSH Deploy
        run: |
          # Download cloudflared inside the GitHub Action runner
          sudo mkdir -p /usr/local/bin
          sudo curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # Write a temporary SSH config file so the runner knows to use the tunnel
          mkdir -p ~/.ssh
          echo -e "Host ssh.labflowpro.co.uk\n  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Save the private key to a file safely
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Connect and execute the local pull and deployment script
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@ssh.labflowpro.co.uk << 'EOF'
            cd /home/afilesnice/mediguard/
            git pull origin main
            cd mediguard-frontend
            npm install --legacy-peer-deps
            npm run build
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart nginx
          EOF

name: Deploy MediGuard Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'
          cache: 'npm'
          cache-dependency-path: './mediguard-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd mediguard-frontend
          npm ci  --legacy-peer-deps

      - name: Build Frontend Bundle
        run: |
          cd mediguard-frontend
          npm run build

      - name: Deploy Frontend Files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "mediguard-frontend/dist/*"
          target: "/home/afilesnice/mediguard/"
          strip_components: 1

