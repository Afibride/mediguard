name: Deploy MediGuard Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloudflare Client & Run SSH Deploy
        run: |
          # Install cloudflared
          sudo mkdir -p /usr/local/bin
          sudo curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # Configure SSH to use Cloudflare Access
          mkdir -p ~/.ssh
          echo -e "Host ssh.labflowpro.co.uk\n  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Add private key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Connect to server and deploy
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@ssh.labflowpro.co.uk << 'EOF'
            cd /home/afilesnice/mediguard/
            git pull origin main

            # Build frontend
            cd mediguard-frontend
            npm install --legacy-peer-deps
            npm run build

            # Restart nginx
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart nginx
          EOF
