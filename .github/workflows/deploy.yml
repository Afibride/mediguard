name: Deploy MediGuard Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloudflare Client & Run SSH Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SUDO_PASS: ${{ secrets.SUDO_PASSWORD }}
        run: |
          # Install cloudflared
          sudo mkdir -p /usr/local/bin
          sudo curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # Configure SSH to target your updated domain
          mkdir -p ~/.ssh
          echo -e "Host ssh.mediguard.info\n  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Add private key
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Connect to your server domain via Cloudflare Tunnel
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SSH_USER@ssh.mediguard.info << 'EOF'
            set -e

            cd /home/afilesnice/mediguard/
            git fetch origin main
            git reset --hard origin/main

            # ----------------------------------------
            # 1. DEPLOY BACKEND
            # ----------------------------------------
            cd mediguard-backend
            
            # Activate your virtual environment and update packages
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Go back to root
            cd ..

            # ----------------------------------------
            # 2. DEPLOY FRONTEND
            # ----------------------------------------
            cd mediguard-frontend
            npm install --legacy-peer-deps
            npx vite build
            cd ..

            # ----------------------------------------
            # 3. RELOAD & RESTART SERVICES
            # ----------------------------------------
            # Use sudo password to restart both the backend service and reload Nginx
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart mediguard-backend
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl reload nginx
          EOF
