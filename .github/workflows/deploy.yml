name: Deploy MediGuard Application

on:
  push:
    branches:
      - main  # Triggers the deployment whenever you push code to your main branch

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'
          cache: 'npm'
          cache-dependency-path: './mediguard-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd mediguard-frontend
          npm ci  --legacy-peer-deps

      - name: Build Frontend Bundle
        run: |
          cd mediguard-frontend
          npm run build

      - name: Deploy Frontend Files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "mediguard-frontend/dist/*"
          target: "/home/afilesnice/mediguard/"
          strip_components: 1

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend # Ensures frontend finishes deploying first
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Backend Files & Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to backend and sync new Python scripts
            cd /home/afilesnice/mediguard/
            git pull origin main
            
            # Activate virtual environment and keep dependencies clean
            cd mediguard-backend
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Safe systemd service restarts using the stored sudo password
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart mediguard-backend.service
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart nginx
